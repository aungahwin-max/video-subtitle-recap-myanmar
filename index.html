<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Recap Myanmar Pro</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --border: #232f48;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.15rem;
      color: #38bdf8;
      margin: 0;
    }
    .badge {
      background: #1e1b4b;
      color: #818cf8;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Video Player Box */
    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.2s ease;
    }
    .blur-overlay {
      position: absolute;
      bottom: 14%;
      left: 10%;
      width: 80%;
      height: 48px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed #38bdf8;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }
    .subtitle-overlay {
      position: absolute;
      bottom: 14%;
      left: 5%;
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.4;
      text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
      pointer-events: none;
      z-index: 10;
      word-break: break-word;
    }

    /* Tab Menu Navigation */
    .tabs-nav {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Tab Content Cards */
    .tab-content {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      flex-direction: column;
      gap: 12px;
    }
    .tab-content.active {
      display: flex;
    }

    input[type="file"], select, textarea, input[type="range"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #0b1120;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
      font-size: 0.85rem;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-sub);
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    button.btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.btn-green {
      background-color: #10b981;
    }
    button.btn-gray {
      background-color: #334155;
      font-size: 0.8rem;
      padding: 6px 10px;
    }

    /* Dialogue Timeline Item */
    .dialogue-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #090e1a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Subtitle Recap Pro</h1>
    <span class="badge">Myanmar AI v2.0</span>
  </header>

  <!-- Video Viewport -->
  <div class="video-wrapper">
    <div class="video-container" id="videoContainer">
      <video id="videoPreview" playsinline controls></video>
      <div class="blur-overlay" id="blurOverlay"></div>
      <div class="subtitle-overlay" id="subtitleOverlay"></div>
    </div>
  </div>

  <!-- Tab Menu -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('tab-video')">📹 ဗီဒီယို</button>
    <button class="tab-btn" onclick="switchTab('tab-blur')">🌫️ Blur Box</button>
    <button class="tab-btn" onclick="switchTab('tab-recap')">🎙️ AI စကားပြော</button>
    <button class="tab-btn" onclick="switchTab('tab-srt')">📄 SRT ဖိုင်</button>
  </div>

  <!-- TAB 1: ဗီဒီယို စနစ်များ -->
  <div class="tab-content active" id="tab-video">
    <div class="control-row">
      <label>၁။ ဗီဒီယိုဖိုင် ရွေးချယ်ပါ:</label>
      <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="control-row">
      <label>ဗီဒီယို အချိုးအစား (Aspect Ratio):</label>
      <select id="aspectRatio">
        <option value="auto">မူရင်းအတိုင်း (Original)</option>
        <option value="9/16">9:16 (TikTok / Reels / Shorts)</option>
        <option value="16/9">16:9 (YouTube Standard)</option>
        <option value="1/1">1:1 (Square)</option>
      </select>
    </div>

    <div class="flex-row">
      <label style="font-size:0.85rem;">Mirror (ဘယ်/ညာ လှန်မည်):</label>
      <input type="checkbox" id="mirrorToggle" style="width:20px; height:20px;">
    </div>

    <div class="control-row">
      <div class="flex-row">
        <label>Zoom (ဗီဒီယို ချုံ့/ချဲ့):</label>
        <span id="zoomVal" style="color:#38bdf8; font-size:0.8rem;">100%</span>
      </div>
      <input type="range" id="videoZoom" min="100" max="180" value="100">
    </div>
  </div>

  <!-- TAB 2: Blur Box အပြင်အဆင် -->
  <div class="tab-content" id="tab-blur">
    <div class="control-row">
      <label>အထက်/အောက် ရွှေ့ရန် (Position Y):</label>
      <input type="range" id="posY" min="0" max="85" value="14">
    </div>
    <div class="control-row">
      <label>Box အကျယ် (Width):</label>
      <input type="range" id="boxWidth" min="20" max="100" value="80">
    </div>
    <div class="control-row">
      <label>Box အမြင့် (Height):</label>
      <input type="range" id="boxHeight" min="20" max="150" value="48">
    </div>
    <div class="control-row">
      <label>Blur ဝါးသည့်နှုန်း (Strength):</label>
      <input type="range" id="blurStrength" min="0" max="30" value="12">
    </div>
    <div class="control-row">
      <label>စာတန်းထိုး အရောင်:</label>
      <select id="subColor">
        <option value="#ffffff">အဖြူရောင် (White)</option>
        <option value="#facc15">အဝါရ
