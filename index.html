<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Recap Myanmar</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin: 0 0 4px 0;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0 0 12px 0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0;
      color: #f1f5f9;
    }
    input[type="file"], select, textarea, input[type="range"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.9rem;
    }
    textarea {
      resize: vertical;
      height: 85px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:active {
      background-color: #0369a1;
    }
    
    /* Video Box & Layers */
    .video-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .blur-overlay {
      position: absolute;
      bottom: 14%;
      left: 10%;
      width: 80%;
      height: 48px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed #38bdf8;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }
    /* ဗီဒီယိုပေါ်က မြန်မာစာတန်းထိုး Style */
    .subtitle-overlay {
      position: absolute;
      bottom: 15%;
      left: 5%;
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.4;
      text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
      pointer-events: none;
      z-index: 10;
      word-break: break-word;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .btn-sync {
      background-color: #10b981;
    }
    .btn-sync:active {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div>
    <h1>🎬 Video Subtitle Recap Myanmar</h1>
    <p class="sub">မြန်မာစာတန်းထိုးနှင့် AI အသံ ဗီဒီယိုပေါင်းစပ်စနစ်</p>
  </div>

  <!-- အဆင့် ၁ - ဗီဒီယို တင်ရန် -->
  <div class="card">
    <h2>၁။ Video ဖိုင် ရွေးချယ်ပါ</h2>
    <input type="file" id="videoInput" accept="video/*">
    <div class="video-wrapper">
      <div class="video-container" id="videoContainer">
        <video id="videoPreview" playsinline></video>
        <div class="blur-overlay" id="blurOverlay"></div>
        <div class="subtitle-overlay" id="subtitleOverlay"></div>
      </div>
    </div>
  </div>

  <!-- အဆင့် ၂ - ဗီဒီယို Size -->
  <div class="card">
    <h2>၂။ Video အချိုးအစား (Aspect Ratio)</h2>
    <select id="aspectRatio">
      <option value="auto">မူရင်းအတိုင်း (Original)</option>
      <option value="9/16">9:16 (TikTok / Reels / Shorts)</option>
      <option value="16/9">16:9 (YouTube Standard)</option>
      <option value="1/1">1:1 (Square)</option>
    </select>
  </div>

  <!-- အဆင့် ၃ - စာသားဖုံး Blur Box အပြင်အဆင် -->
  <div class="card">
    <h2>၃။ မူရင်းစာတန်းဖုံးအုပ်မည့် Blur Box</h2>
    <div class="control-row">
      <label>အထက်/အောက် ရွှေ့ရန် (Position Y):</label>
      <input type="range" id="posY" min="0" max="85" value="14">
    </div>
    <div class="control-row">
      <label>Box အကျယ် (Width):</label>
      <input type="range" id="boxWidth" min="20" max="100" value="80">
    </div>
    <div class="control-row">
      <label>Box အမြင့် (Height):</label>
      <input type="range" id="boxHeight" min="20" max="150" value="48">
    </div>
    <div class="control-row">
      <label>Blur ဝါးသည့်နှုန်း (Blur Strength):</label>
      <input type="range" id="blurStrength" min="0" max="30" value="12">
    </div>
  </div>

  <!-- အဆင့် ၄ - ဇာတ်ညွှန်းနှင့် အသံ/စာတန်းထိုး တပြိုင်နက်ဖွင့်စနစ် -->
  <div class="card">
    <h2>၄။ မြန်မာစာတန်းထိုးနှင့် AI အသံထွက်</h2>
    <textarea id="scriptText" placeholder="ဒီနေရာတွင် မြန်မာလို ဖတ်ပြစေလိုသော စာသားကို ရိုက်ထည့်ပါ..."></textarea>
    
    <button class="btn-sync" id="playRecapBtn">▶️ Recap (ဗီဒီယို + အသံ + စာတန်း) အစမ်းဖွင့်မည်</button>
    
    <audio id="audioEngine" style="display:none;"></audio>
    <span id="syncStatus" style="font-size: 0.85rem; color: #38bdf8;"></span>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoContainer = document.getElementById('videoContainer');
    const videoPreview = document.getElementById('videoPreview');
    const blurOverlay = document.getElementById('blurOverlay');
    const subtitleOverlay = document.getElementById('subtitleOverlay');
    const aspectRatio = document.getElementById('aspectRatio');

    const posY = document.getElementById('posY');
    const boxWidth = document.getElementById('boxWidth');
    const boxHeight = document.getElementById('boxHeight');
    const blurStrength = document.getElementById('blurStrength');

    const scriptText = document.getElementById('scriptText');
    const playRecapBtn = document.getElementById('playRecapBtn');
    const audioEngine = document.getElementById('audioEngine');
    const syncStatus = document.getElementById('syncStatus');

    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        videoPreview.src = URL.createObjectURL(file);
        videoContainer.style.display = 'block';
      }
    });

    aspectRatio.addEventListener('change', function(e) {
      videoContainer.style.aspectRatio = e.target.value === 'auto' ? '' : e.target.value;
    });

    function updateBlurBox() {
      blurOverlay.style.bottom = `${posY.value}%`;
      blurOverlay.style.width = `${boxWidth.value}%`;
      blurOverlay.style.left = `${(100 - boxWidth.value) / 2}%`;
      blurOverlay.style.height = `${boxHeight.value}px`;
      blurOverlay.style.backdropFilter = `blur(${blurStrength.value}px)`;
      blurOverlay.style.webkitBackdropFilter = `blur(${blurStrength.value}px)`;
      
      // စာတန်းထိုးနေရာကို Blur Box ပေါ် ကွက်တိ အံဝင်စေရန် ချိတ်ဆက်ထားခြင်း
      subtitleOverlay.style.bottom = `${posY.value}%`;
    }

    posY.addEventListener('input', updateBlurBox);
    boxWidth.addEventListener('input', updateBlurBox);
    boxHeight.addEventListener('input', updateBlurBox);
    blurStrength.addEventListener('input', updateBlurBox);

    // စာရိုက်လိုက်တာနဲ့ ဗီဒီယိုပေါ်မှာ Subtitle တပြိုင်နက် ပြသခြင်း
    scriptText.addEventListener('input', function() {
      subtitleOverlay.innerText = scriptText.value;
    });

    // ဗီဒီယို + AI အသံ + စာတန်းထိုး တပြိုင်နက်ဖွင့်ခြင်း
    playRecapBtn.addEventListener('click', function() {
      const text = scriptText.value.trim();
      if (!text) {
        alert('ကျေးဇူးပြု၍ မြန်မာစာသား အရင်ရိုက်ထည့်ပါခင်ဗျာ။');
        return;
      }

      subtitleOverlay.innerText = text;
      syncStatus.innerText = 'မြန်မာ AI အသံ ပြင်ဆင်နေပါသည်...';

      // အသံအရင်းအမြစ် ဆွဲယူခြင်း
      const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=my&client=tw-ob`;
      audioEngine.src = ttsUrl;

      // ဗီဒီယိုအစသို့ ပြန်ပို့ပြီး မူရင်းအသံကို အနည်းငယ် လျှော့ကာ AI အသံနှင့် တပြိုင်နက်ဖွင့်ခြင်း
      videoPreview.currentTime = 0;
      videoPreview.volume = 0.25; // နောက်ခံသံအဖြစ် မူရင်းအသံကို 25% သာဖွင့်ပါမည်

      audioEngine.play().then(() => {
        videoPreview.play();
        syncStatus.innerText = '▶️ ဗီဒီယိုနှင့် မြန်မာအသံ တပြိုင်နက် ဖတ်ပြနေပါသည်...';
      }).catch(() => {
        // Fallback: Browser Web Speech စနစ်ဖြင့် အသံဖွင့်ခြင်း
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'my-MM';
          utterance.rate = 0.9;
          
          utterance.onstart = () => {
            videoPreview.play();
            syncStatus.innerText = '▶️ ဗီဒီယိုနှင့် စာတန်း စတင်ဖွင့်နေပါသည်...';
          };
          window.speechSynthesis.speak(utterance);
        } else {
          videoPreview.play();
          syncStatus.innerText = 'ဗီဒီယို ဖွင့်နေပါသည် (အသံပိတ်ထားပါသည်)။';
        }
      });

      audioEngine.onended = function() {
        syncStatus.innerText = '✅ ဖတ်ပြီးပါပြီ။';
      };
    });
  </script>
</body>
</html>
