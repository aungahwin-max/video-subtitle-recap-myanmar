<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Recap Myanmar</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin: 0 0 4px 0;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0 0 12px 0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0;
      color: #f1f5f9;
    }
    input[type="file"], select, textarea, input[type="range"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.9rem;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:active {
      background-color: #0369a1;
    }
    
    .video-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .blur-overlay {
      position: absolute;
      bottom: 14%;
      left: 10%;
      width: 80%;
      height: 48px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed #38bdf8;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }
    .subtitle-overlay {
      position: absolute;
      bottom: 14%;
      left: 5%;
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.4;
      text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
      pointer-events: none;
      z-index: 10;
      word-break: break-word;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .btn-sync {
      background-color: #10b981;
    }
    .btn-sync:active {
      background-color: #059669;
    }
    .btn-export-video {
      background-color: #ef4444;
    }
    .btn-export-video:active {
      background-color: #dc2626;
    }
    .btn-export {
      background-color: #8b5cf6;
    }
    .btn-add {
      background-color: #334155;
      font-size: 0.85rem;
      padding: 8px;
    }

    .dialogue-box {
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .dialogue-header select {
      flex: 1;
      padding: 6px;
    }
    .time-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .time-inputs input {
      padding: 4px 6px;
      font-size: 0.8rem;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div>
    <h1>🎬 Video Subtitle Recap Myanmar</h1>
    <p class="sub">Multi-Voice AI အသံနှင့် Video Export စနစ်</p>
  </div>

  <!-- အဆင့် ၁ -->
  <div class="card">
    <h2>၁။ Video ဖိုင် ရွေးချယ်ပါ</h2>
    <input type="file" id="videoInput" accept="video/*">
    <div class="video-wrapper">
      <div class="video-container" id="videoContainer">
        <video id="videoPreview" playsinline controls></video>
        <div class="blur-overlay" id="blurOverlay"></div>
        <div class="subtitle-overlay" id="subtitleOverlay"></div>
      </div>
    </div>
    <!-- Hidden Canvas for Video Exporting -->
    <canvas id="renderCanvas"></canvas>
  </div>

  <!-- အဆင့် ၂ -->
  <div class="card">
    <h2>၂။ မူရင်းစာတန်းဖုံးအုပ်မည့် Blur Box</h2>
    <div class="control-row">
      <label>အထက်/အောက် ရွှေ့ရန် (Position Y):</label>
      <input type="range" id="posY" min="0" max="85" value="14">
    </div>
    <div class="control-row">
      <label>Box အကျယ် (Width):</label>
      <input type="range" id="boxWidth" min="20" max="100" value="80">
    </div>
    <div class="control-row">
      <label>Box အမြင့် (Height):</label>
      <input type="range" id="boxHeight" min="20" max="150" value="48">
    </div>
    <div class="control-row">
      <label>Blur ဝါးသည့်နှုန်း (Blur Strength):</label>
      <input type="range" id="blurStrength" min="0" max="30" value="12">
    </div>
  </div>

  <!-- အဆင့် ၃ -->
  <div class="card">
    <h2>၃။ SRT စာတန်းထိုး (Import / Export)</h2>
    <input type="file" id="srtFileInput" accept=".srt">
    <button class="btn-export" id="exportSrtBtn">📥 SRT ဖိုင်အဖြစ် ဒေါင်းလုဒ်ဆွဲမည် (.srt)</button>
  </div>

  <!-- အဆင့် ၄ -->
  <div class="card">
    <h2>၄။ စကားပြောခန်းများ နှင့် Recap ပြုလုပ်ခြင်း</h2>
    <div id="dialogueList" style="display: flex; flex-direction: column; gap: 10px;">
      
      <div class="dialogue-box">
        <div class="dialogue-header">
          <select class="voice-role">
            <option value="narrator">🎙️ Recap ရှင်းပြသံ</option>
            <option value="girl" selected>👧 မိန်းကလေးသံ</option>
            <option value="boy">👦 ကောင်လေးသံ</option>
            <option value="man">👨 လူကြီးသံ</option>
            <option value="woman">👩 မိန်းမကြီးသံ</option>
          </select>
        </div>
        <div class="time-inputs">
          <span>စတင်ချိန် (စက္ကန့်):</span>
          <input type="number" class="time-start" value="0" step="0.5">
          <span>ပြီးဆုံးချိန်:</span>
          <input type="number" class="time-end" value="3" step="0.5">
        </div>
        <textarea class="dialogue-text" rows="2" placeholder="ပြောမည့် စာသားရိုက်ပါ...">ရှင် အခု ဘာလုပ်နေတာလဲ...</textarea>
      </div>

      <div class="dialogue-box">
        <div class="dialogue-header">
          <select class="voice-role">
            <option value="narrator">🎙️ Recap ရှင်းပြသံ</option>
            <option value="boy" selected>👦 ကောင်လေးသံ</option>
            <option value="girl">👧 မိန်းကလေးသံ</option>
            <option value="man">👨 လူကြီးသံ</option>
            <option value="woman">👩 မိန်းမကြီးသံ</option>
          </select>
        </div>
        <div class="time-inputs">
          <span>စတင်ချိန် (စက္ကန့်):</span>
          <input type="number" class="time-start" value="3.5" step="0.5">
          <span>ပြီးဆုံးချိန်:</span>
          <input type="number" class="time-end" value="6.5" step="0.5">
        </div>
        <textarea class="dialogue-text" rows="2" placeholder="ပြောမည့် စာသားရိုက်ပါ...">ငါ မင်းကို ကာကွယ်ပေးမလို့လေ...</textarea>
      </div>

    </div>

    <button type="button" class="btn-add" id="addDialogueBtn">➕ စကားပြောခန်းအသစ် ထပ်ထည့်မည်</button>
    <button class="btn-sync" id="playRecapBtn" style="margin-top: 6px;">▶️ Recap အစမ်းဖွင့်ကြည့်မည်</button>
    <button class="btn-export-video" id="exportVideoBtn" style="margin-top: 6px;">🔴 Export (ဗီဒီယိုဖိုင် အသစ်သိမ်းဆည်းမည်)</button>
    <span id="syncStatus" style="font-size: 0.85rem; color: #38bdf8;"></span>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoContainer = document.getElementById('videoContainer');
    const videoPreview = document.getElementById('videoPreview');
    const blurOverlay = document.getElementById('blurOverlay');
    const subtitleOverlay = document.getElementById('subtitleOverlay');

    const posY = document.getElementById('posY');
    const boxWidth = document.getElementById('boxWidth');
    const boxHeight = document.getElementById('boxHeight');
    const blurStrength = document.getElementById('blurStrength');

    const dialogueList = document.getElementById('dialogueList');
    const addDialogueBtn = document.getElementById('addDialogueBtn');
    const playRecapBtn = document.getElementById('playRecapBtn');
    const exportVideoBtn = document.getElementById('exportVideoBtn');
    const syncStatus = document.getElementById('syncStatus');
    const exportSrtBtn = document.getElementById('exportSrtBtn');
    const srtFileInput = document.getElementById('srtFileInput');
    const renderCanvas = document.getElementById('renderCanvas');

    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        videoPreview.src = URL.createObjectURL(file);
        videoContainer.style.display = 'block';
      }
    });

    function updateBlurBox() {
      blurOverlay.style.bottom = `${posY.value}%`;
      blurOverlay.style.width = `${boxWidth.value}%`;
      blurOverlay.style.left = `${(100 - boxWidth.value) / 2}%`;
      blurOverlay.style.height = `${boxHeight.value}px`;
      blurOverlay.style.backdropFilter = `blur(${blurStrength.value}px)`;
      blurOverlay.style.webkitBackdropFilter = `blur(${blurStrength.value}px)`;
      subtitleOverlay.style.bottom = `${posY.value}%`;
    }

    posY.addEventListener('input', updateBlurBox);
    boxWidth.addEventListener('input', updateBlurBox);
    boxHeight.addEventListener('input', updateBlurBox);
    blurStrength.addEventListener('input', updateBlurBox);

    const voiceProfiles = {
      narrator: { pitch: 1.0, rate: 0.95 },
      boy: { pitch: 1.25, rate: 1.0 },
      girl: { pitch: 1.5, rate: 1.05 },
      man: { pitch: 0.65, rate: 0.85 },
      woman: { pitch: 1.1, rate: 0.95 }
    };

    addDialogueBtn.addEventListener('click', function() {
      const div = document.createElement('div');
      div.className = 'dialogue-box';
      div.innerHTML = `
        <div class="dialogue-header">
          <select class="voice-role">
            <option value="narrator">🎙️ Recap ရှင်းပြသံ</option>
            <option value="boy">👦 ကောင်လေးသံ</option>
            <option value="girl">👧 မိန်းကလေးသံ</option>
            <option value="man">👨 လူကြီးသံ</option>
            <option value="woman">👩 မိန်းမကြီးသံ</option>
          </select>
          <button style="background:#ef4444; padding: 4px 8px; font-size: 0.75rem;" onclick="this.parentElement.parentElement.remove()">ဖျက်မည်</button>
        </div>
        <div class="time-inputs">
          <span>စတင်ချိန်:</span>
          <input type="number" class="time-start" value="0" step="0.5">
          <span>ပြီးဆုံးချိန်:</span>
          <input type="number" class="time-end" value="3" step="0.5">
        </div>
        <textarea class="dialogue-text" rows="2" placeholder="ပြောမည့် စာသားရိုက်ပါ..."></textarea>
      `;
      dialogueList.appendChild(div);
    });

    function getLines() {
      const boxes = document.querySelectorAll('.dialogue-box');
      const lines = [];
      boxes.forEach(box => {
        const role = box.querySelector('.voice-role').value;
        const text = box.querySelector('.dialogue-text').value.trim();
        const start = parseFloat(box.querySelector('.time-start').value) || 0;
        const end = parseFloat(box.querySelector('.time-end').value) || (start + 2.5);
        if (text) lines.push({ role, text, start, end });
      });
      return lines;
    }

    // စမ်းသပ် Playback
    playRecapBtn.addEventListener('click', function() {
      const lines = getLines();
      if (lines.length === 0) {
        alert('စကားပြောခန်း စာသား အရင်ရိုက်ထည့်ပါခင်ဗျာ။');
        return;
      }

      window.speechSynthesis.cancel();
      videoPreview.currentTime = 0;
      videoPreview.volume = 0.2;
      videoPreview.play();

      let currentIndex = 0;

      function speakNext() {
        if (currentIndex >= lines.length) {
          syncStatus.innerText = '✅ Recap အစမ်းဖွင့်ပြီးပါပြီ။';
          return;
        }

        const currentLine = lines[currentIndex];
        subtitleOverlay.innerText = currentLine.text;
        syncStatus.innerText = `▶️ [${currentLine.role}] ဖတ်ပြနေပါသည်...`;

        const utterance = new SpeechSynthesisUtterance(currentLine.text);
        utterance.lang = 'my-MM';
        const profile = voiceProfiles[currentLine.role] || voiceProfiles.narrator;
        utterance.pitch = profile.pitch;
        utterance.rate = profile.rate;

        utterance.onend = function() {
          currentIndex++;
          speakNext();
        };
        utterance.onerror = function() {
          currentIndex++;
          speakNext();
        };

        window.speechSynthesis.speak(utterance);
      }

      speakNext();
    });

    // ဗီဒီယို Export Render ပြုလုပ်ခြင်း
    exportVideoBtn.addEventListener('click', async function() {
      if (!videoPreview.src) {
        alert('ကျေးဇူးပြု၍ Video ဖိုင်အရင် ရွေးချယ်ပါခင်ဗျာ။');
        return;
      }

      const lines = getLines();
      if (lines.length === 0) {
        alert('စာတန်းထိုး စာသားမရှိသေးပါခင်ဗျာ။');
        return;
      }

      syncStatus.innerText = '⏳ ဗီဒီယို Export Render ပြုလုပ်နေပါသည်... စောင့်ဆိုင်းပေးပါ...';
      exportVideoBtn.disabled = true;

      renderCanvas.width = videoPreview.videoWidth || 720;
      renderCanvas.height = videoPreview.videoHeight || 1280;
      const ctx = renderCanvas.getContext('2d');

      const stream = renderCanvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'recap_video_myanmar.mp4';
        a.click();
        URL.revokeObjectURL(url);
        syncStatus.innerText = '✅ ဗီဒီယိုဖိုင် အောင်မြင်စွာ ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ!';
        exportVideoBtn.disabled = false;
      };

      recorder.start();
      videoPreview.currentTime = 0;
      videoPreview.play();

      let currentSubText = '';
      let isRendering = true;

      // Canvas Frame ရေးဆွဲခြင်း Loop
      function drawFrame() {
        if (!isRendering) return;

        ctx.drawImage(videoPreview, 0, 0, renderCanvas.width, renderCanvas.height);

        // Blur Mask ရေးဆွဲခြင်း
        const bWidth = (renderCanvas.width * boxWidth.value) / 100;
        const bHeight = parseInt(boxHeight.value) * (renderCanvas.height / 600);
        const bLeft = (renderCanvas.width - bWidth) / 2;
        const bBottom = (renderCanvas.height * posY.value) / 100;
        const bTop = renderCanvas.height - bBottom - bHeight;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(bLeft, bTop, bWidth, bHeight);

        // မြန်မာစာတန်းထိုး ရေးဆွဲခြင်း
        if (currentSubText) {
          ctx.font
