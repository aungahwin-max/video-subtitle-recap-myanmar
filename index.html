<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Recap Myanmar</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin: 0 0 4px 0;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0 0 12px 0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0;
      color: #f1f5f9;
    }
    input[type="file"], select, textarea, input[type="range"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background-color: #0369a1;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
      max-height: 250px;
    }
    audio {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div>
    <h1>🎬 Video Subtitle Recap Myanmar</h1>
    <p class="sub">မြန်မာစာတန်းထိုးနှင့် Video Recap ပြုလုပ်ရန်</p>
  </div>

  <div class="card">
    <h2>၁။ Video ရွေးချယ်ပါ</h2>
    <input type="file" id="videoInput" accept="video/*">
    <video id="videoPreview" controls style="display:none;"></video>
  </div>

  <div class="card">
    <h2>၂။ Video အပြင်အဆင်</h2>
    <label>Video အချိုး</label>
    <select id="aspectRatio">
      <option value="9:16">9:16 - TikTok / Shorts</option>
      <option value="16:9">16:9 - YouTube</option>
      <option value="1:1">1:1 - Square</option>
    </select>
    <label>Preview Blur</label>
    <input type="range" id="blurRange" min="0" max="20" value="0">
  </div>

  <div class="card">
    <h2>၃။ မြန်မာစာတန်းထိုးနှင့် ဇာတ်ညွှန်း</h2>
    <textarea id="scriptText" placeholder="မြန်မာစာတန်း သို့မဟုတ် ဖတ်ပြစေလိုသော စာသားကို ဒီမှာရေးပါ..."></textarea>
  </div>

  <div class="card">
    <h2>၄။ မြန်မာ AI အသံ စမ်းသပ်ရန်</h2>
    <button id="playVoiceBtn">🔊 မြန်မာ AI အသံ နားထောင်မည်</button>
    <audio id="audioPlayer" controls style="display:none;"></audio>
    <span id="voiceStatus" style="font-size: 0.8rem; color: #94a3b8;"></span>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoPreview = document.getElementById('videoPreview');
    const blurRange = document.getElementById('blurRange');

    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        videoPreview.src = URL.createObjectURL(file);
        videoPreview.style.display = 'block';
      }
    });

    blurRange.addEventListener('input', function(e) {
      videoPreview.style.filter = `blur(${e.target.value}px)`;
    });

    const playVoiceBtn = document.getElementById('playVoiceBtn');
    const scriptText = document.getElementById('scriptText');
    const audioPlayer = document.getElementById('audioPlayer');
    const voiceStatus = document.getElementById('voiceStatus');

    playVoiceBtn.addEventListener('click', function() {
      const text = scriptText.value.trim();
      if (!text) {
        alert('ကျေးဇူးပြု၍ စာသားအရင်ရိုက်ထည့်ပါခင်ဗျာ။');
        return;
      }

      voiceStatus.innerText = 'အသံထုတ်ယူနေပါသည်...';
      const encodedText = encodeURIComponent(text);
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=my&client=tw-ob`;

      audioPlayer.src = audioUrl;
      audioPlayer.style.display = 'block';
      
      audioPlayer.play().then(() => {
        voiceStatus.innerText = 'အသံဖွင့်နေပါသည်...';
      }).catch(err => {
        window.open(audioUrl, '_blank');
        voiceStatus.innerText = 'Browser ကနေ အသံဖွင့်ပေးထားပါသည်';
      });
    });
  </script>
</body>
</html>
