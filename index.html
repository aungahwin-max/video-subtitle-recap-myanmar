<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Subtitle Recap Myanmar</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin: 0 0 4px 0;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.85rem;
      margin: 0 0 12px 0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0;
      color: #f1f5f9;
    }
    input[type="file"], textarea, input[type="range"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background-color: #0369a1;
    }
    
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
    video {
      width: 100%;
      display: block;
    }
    .blur-overlay {
      position: absolute;
      bottom: 15%;
      left: 10%;
      width: 80%;
      height: 45px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px dashed #38bdf8;
      border-radius: 4px;
      pointer-events: none;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div>
    <h1>🎬 Video Subtitle Recap Myanmar</h1>
    <p class="sub">မြန်မာစာတန်းထိုးနှင့် Video Recap ပြုလုပ်ရန်</p>
  </div>

  <div class="card">
    <h2>၁။ Video ရွေးချယ်ပါ</h2>
    <input type="file" id="videoInput" accept="video/*">
    <div class="video-container" id="videoContainer">
      <video id="videoPreview" controls playsinline></video>
      <div class="blur-overlay" id="blurOverlay"></div>
    </div>
  </div>

  <div class="card">
    <h2>၂။ စာသားဖုံးအုပ်မည့် Blur Box အပြင်အဆင်</h2>
    <div class="control-row">
      <label>အထက်/အောက် ရွှေ့ရန် (Position Y):</label>
      <input type="range" id="posY" min="0" max="90" value="15">
    </div>
    <div class="control-row">
      <label>Box အကျယ် (Width):</label>
      <input type="range" id="boxWidth" min="20" max="100" value="80">
    </div>
    <div class="control-row">
      <label>Box အမြင့် (Height):</label>
      <input type="range" id="boxHeight" min="20" max="150" value="45">
    </div>
    <div class="control-row">
      <label>Blur ဝါးသည့်နှုန်း (Blur Strength):</label>
      <input type="range" id="blurStrength" min="0" max="30" value="12">
    </div>
  </div>

  <div class="card">
    <h2>၃။ မြန်မာစာတန်းထိုးနှင့် ဇာတ်ညွှန်း</h2>
    <textarea id="scriptText" placeholder="ဖတ်ပြစေလိုသော မြန်မာစာသားကို ဒီမှာရိုက်ထည့်ပါ..."></textarea>
  </div>

  <div class="card">
    <h2>၄။ မြန်မာ AI အသံ စမ်းသပ်ရန်</h2>
    <button id="playVoiceBtn">🔊 မြန်မာ AI အသံ နားထောင်မည်</button>
    <span id="voiceStatus" style="font-size: 0.85rem; color: #38bdf8; margin-top: 4px;"></span>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoContainer = document.getElementById('videoContainer');
    const videoPreview = document.getElementById('videoPreview');
    const blurOverlay = document.getElementById('blurOverlay');

    const posY = document.getElementById('posY');
    const boxWidth = document.getElementById('boxWidth');
    const boxHeight = document.getElementById('boxHeight');
    const blurStrength = document.getElementById('blurStrength');

    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        videoPreview.src = URL.createObjectURL(file);
        videoContainer.style.display = 'block';
      }
    });

    function updateBlurBox() {
      blurOverlay.style.bottom = `${posY.value}%`;
      blurOverlay.style.width = `${boxWidth.value}%`;
      blurOverlay.style.left = `${(100 - boxWidth.value) / 2}%`;
      blurOverlay.style.height = `${boxHeight.value}px`;
      blurOverlay.style.backdropFilter = `blur(${blurStrength.value}px)`;
      blurOverlay.style.webkitBackdropFilter = `blur(${blurStrength.value}px)`;
    }

    posY.addEventListener('input', updateBlurBox);
    boxWidth.addEventListener('input', updateBlurBox);
    boxHeight.addEventListener('input', updateBlurBox);
    blurStrength.addEventListener('input', updateBlurBox);

    const playVoiceBtn = document.getElementById('playVoiceBtn');
    const scriptText = document.getElementById('scriptText');
    const voiceStatus = document.getElementById('voiceStatus');

    playVoiceBtn.addEventListener('click', function() {
      const text = scriptText.value.trim();
      if (!text) {
        alert('ကျေးဇူးပြု၍ စာသားအရင်ရိုက်ထည့်ပါခင်ဗျာ။');
        return;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'my-MM';
        utterance.rate = 0.9;

        utterance.onstart = function() {
          voiceStatus.innerText = '🔊 အသံဖတ်နေပါသည်...';
        };

        utterance.onend = function() {
          voiceStatus.innerText = '✅ ဖတ်ပြီးပါပြီ။';
        };

        utterance.onerror = function() {
          const fallbackUrl = `https://translate.google.com/?sl=auto&tl=my&text=${encodeURIComponent(text)}&op=translate`;
          window.open(fallbackUrl, '_blank');
          voiceStatus.innerText = 'Google Translate တွင် အသံဖွင့်ရန် ပြောင်းပေးထားပါသည်။';
        };

        window.speechSynthesis.speak(utterance);
      } else {
        alert('သင့်ဖုန်း Browser တွင် Speech Synthesis စနစ် မပံ့ပိုးသေးပါခင်ဗျာ။');
      }
    });
  </script>
</body>
</html>
